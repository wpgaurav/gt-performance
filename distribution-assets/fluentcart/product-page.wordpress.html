<!-- wp:marketers-delight/inline-page-block {"content":"<div class=\"gt-performance-page\">\n\t<section class=\"gtd gtd-section gtd-section--dark gt-performance-hero\" aria-labelledby=\"gt-performance-hero-title\">\n\t\t<div class=\"gtd-text gt-performance-hero__copy\">\n\t\t\t<p class=\"gtd-eyebrow\">WordPress performance, without cache roulette</p>\n\t\t\t<h1 class=\"gtd-display\" id=\"gt-performance-hero-title\">Fast pages. <span class=\"gtd-gradient-text\">Safe commerce.</span></h1>\n\t\t\t<p class=\"gtd-intro gtd-muted\">GT Performance unifies origin caching, Cloudflare Free, server-side unused CSS, Redis, and WordPress cleanup without treating checkout state as public HTML.</p>\n\t\t\t<div class=\"gt-performance-price\" role=\"group\" aria-label=\"Price and license\">\n\t\t\t\t<p><span class=\"gtd-visuallyhidden\">Price: </span><strong>$199</strong> <span>one-time</span></p>\n\t\t\t\t<p class=\"gtd-caption\">25 WordPress websites · lifetime license</p>\n\t\t\t</div>\n\t\t\t<div class=\"gtd-actions gt-performance-actions\">\n\t\t\t\t<a class=\"gtd-button gtd-button--large\" href=\"https://gauravtiwari.org/?fluent-cart=instant_checkout&item_id=68&quantity=1\">Buy GT Performance for $199</a>\n\t\t\t\t<a class=\"gtd-cta-link\" href=\"#gt-performance-demo\">Try the live demo</a>\n\t\t\t</div>\n\t\t\t<ul class=\"gt-performance-tags\" role=\"list\">\n\t\t\t\t<li>Cloudflare Free</li>\n\t\t\t\t<li>Server-side CSS</li>\n\t\t\t\t<li>Redis object cache</li>\n\t\t\t\t<li>Commerce-aware</li>\n\t\t\t</ul>\n\t\t</div>\n\n\t\t<div class=\"gtd-wide gtp-product-demo\" id=\"gt-performance-demo\" data-gtp-product-demo>\n\t\t\t<div class=\"gtp-demo-toolbar\">\n\t\t\t\t<div>\n\t\t\t\t\t<span class=\"gtp-demo-toolbar__dot\" aria-hidden=\"true\"></span>\n\t\t\t\t\t<strong>Interactive demo</strong>\n\t\t\t\t\t<span>Try the controls. Nothing is saved.</span>\n\t\t\t\t</div>\n\t\t\t\t<button class=\"gtp-demo-reset\" type=\"button\" data-demo-reset>Reset demo</button>\n\t\t\t</div>\n\n\t\t\t<div class=\"gtp-demo-admin\">\n\t\t\t\t<header class=\"gtp-demo-header\">\n\t\t\t\t\t<div>\n\t\t\t\t\t\t<p class=\"gtp-demo-eyebrow\">GT Performance</p>\n\t\t\t\t\t\t<p class=\"gtp-demo-title\">Performance control center</p>\n\t\t\t\t\t\t<p class=\"gtp-demo-lede\">Origin caching, server-side optimization, Cloudflare Free, and commerce-safe delivery in one place.</p>\n\t\t\t\t\t</div>\n\t\t\t\t\t<span class=\"gtp-demo-version\">0.1 alpha</span>\n\t\t\t\t</header>\n\n\t\t\t\t<div class=\"gtp-demo-tabs\" role=\"tablist\" aria-label=\"GT Performance settings\">\n\t\t\t\t\t<button class=\"gtp-demo-tab is-active\" id=\"gtp-demo-tab-dashboard\" type=\"button\" role=\"tab\" aria-selected=\"true\" aria-controls=\"gtp-demo-panel-dashboard\" tabindex=\"0\" data-demo-tab=\"dashboard\">Dashboard</button>\n\t\t\t\t\t<button class=\"gtp-demo-tab\" id=\"gtp-demo-tab-cache\" type=\"button\" role=\"tab\" aria-selected=\"false\" aria-controls=\"gtp-demo-panel-cache\" tabindex=\"-1\" data-demo-tab=\"cache\">Cache</button>\n\t\t\t\t\t<button class=\"gtp-demo-tab\" id=\"gtp-demo-tab-optimization\" type=\"button\" role=\"tab\" aria-selected=\"false\" aria-controls=\"gtp-demo-panel-optimization\" tabindex=\"-1\" data-demo-tab=\"optimization\">Optimization</button>\n\t\t\t\t\t<button class=\"gtp-demo-tab\" id=\"gtp-demo-tab-exceptions\" type=\"button\" role=\"tab\" aria-selected=\"false\" aria-controls=\"gtp-demo-panel-exceptions\" tabindex=\"-1\" data-demo-tab=\"exceptions\">Exceptions</button>\n\t\t\t\t\t<button class=\"gtp-demo-tab\" id=\"gtp-demo-tab-cloudflare\" type=\"button\" role=\"tab\" aria-selected=\"false\" aria-controls=\"gtp-demo-panel-cloudflare\" tabindex=\"-1\" data-demo-tab=\"cloudflare\">Cloudflare</button>\n\t\t\t\t\t<button class=\"gtp-demo-tab\" id=\"gtp-demo-tab-integrations\" type=\"button\" role=\"tab\" aria-selected=\"false\" aria-controls=\"gtp-demo-panel-integrations\" tabindex=\"-1\" data-demo-tab=\"integrations\">Integrations</button>\n\t\t\t\t\t<button class=\"gtp-demo-tab\" id=\"gtp-demo-tab-css-reports\" type=\"button\" role=\"tab\" aria-selected=\"false\" aria-controls=\"gtp-demo-panel-css-reports\" tabindex=\"-1\" data-demo-tab=\"css-reports\">CSS Reports</button>\n\t\t\t\t\t<button class=\"gtp-demo-tab\" id=\"gtp-demo-tab-license\" type=\"button\" role=\"tab\" aria-selected=\"false\" aria-controls=\"gtp-demo-panel-license\" tabindex=\"-1\" data-demo-tab=\"license\">License</button>\n\t\t\t\t\t<button class=\"gtp-demo-tab\" id=\"gtp-demo-tab-tools\" type=\"button\" role=\"tab\" aria-selected=\"false\" aria-controls=\"gtp-demo-panel-tools\" tabindex=\"-1\" data-demo-tab=\"tools\">Tools</button>\n\t\t\t\t</div>\n\n\t\t\t\t<div class=\"gtp-demo-main\">\n\t\t\t\t\t<section class=\"gtp-demo-panel\" id=\"gtp-demo-panel-dashboard\" role=\"tabpanel\" aria-labelledby=\"gtp-demo-tab-dashboard\" data-demo-panel=\"dashboard\">\n\t\t\t\t\t\t<div class=\"gtp-demo-page-heading\">\n\t\t\t\t\t\t\t<div>\n\t\t\t\t\t\t\t\t<h2>Dashboard</h2>\n\t\t\t\t\t\t\t\t<p>See what is active, what is protected, and what deserves attention next.</p>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t<span class=\"gtp-demo-badge gtp-demo-badge--success\">System healthy</span>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t\t<div class=\"gtp-demo-stats\">\n\t\t\t\t\t\t\t<article>\n\t\t\t\t\t\t\t\t<span>Page cache</span>\n\t\t\t\t\t\t\t\t<strong data-demo-stat=\"cache\">Active</strong>\n\t\t\t\t\t\t\t\t<small>Origin HTML cache</small>\n\t\t\t\t\t\t\t</article>\n\t\t\t\t\t\t\t<article>\n\t\t\t\t\t\t\t\t<span>Cloudflare</span>\n\t\t\t\t\t\t\t\t<strong data-demo-stat=\"cloudflare\">Connected</strong>\n\t\t\t\t\t\t\t\t<small>Free plan ready</small>\n\t\t\t\t\t\t\t</article>\n\t\t\t\t\t\t\t<article>\n\t\t\t\t\t\t\t\t<span>Unused CSS</span>\n\t\t\t\t\t\t\t\t<strong data-demo-stat=\"css\">Enabled</strong>\n\t\t\t\t\t\t\t\t<small>Critical plus file</small>\n\t\t\t\t\t\t\t</article>\n\t\t\t\t\t\t\t<article>\n\t\t\t\t\t\t\t\t<span>CSS files ready</span>\n\t\t\t\t\t\t\t\t<strong data-demo-stat=\"css-ready\">18</strong>\n\t\t\t\t\t\t\t\t<small>1 processing</small>\n\t\t\t\t\t\t\t</article>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t\t<div class=\"gtp-demo-grid\">\n\t\t\t\t\t\t\t<article class=\"gtp-demo-card\">\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-card__header\">\n\t\t\t\t\t\t\t\t\t<div>\n\t\t\t\t\t\t\t\t\t\t<h3>Current configuration</h3>\n\t\t\t\t\t\t\t\t\t\t<p>One policy across every delivery layer.</p>\n\t\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t<ul class=\"gtp-demo-status-list\" role=\"list\">\n\t\t\t\t\t\t\t\t\t<li><span>Fresh cache lifetime</span><strong>1 hour</strong></li>\n\t\t\t\t\t\t\t\t\t<li><span>Stale retention</span><strong>24 hours</strong></li>\n\t\t\t\t\t\t\t\t\t<li><span>CSS delivery</span><strong>Critical inline + file</strong></li>\n\t\t\t\t\t\t\t\t\t<li><span>Redis drop-in</span><strong class=\"gtp-demo-state gtp-demo-state--success\">Owned</strong></li>\n\t\t\t\t\t\t\t\t\t<li><span>Cache directory</span><strong class=\"gtp-demo-state gtp-demo-state--success\">Writable</strong></li>\n\t\t\t\t\t\t\t\t</ul>\n\t\t\t\t\t\t\t</article>\n\t\t\t\t\t\t\t<article class=\"gtp-demo-card gtp-demo-card--tonal\">\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-card__header\">\n\t\t\t\t\t\t\t\t\t<div>\n\t\t\t\t\t\t\t\t\t\t<h3>Recommended next step</h3>\n\t\t\t\t\t\t\t\t\t\t<p>Generate the remaining CSS file after your next design change.</p>\n\t\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t<button class=\"gtp-demo-button\" type=\"button\" data-demo-open-tab=\"css-reports\">Open CSS Reports</button>\n\t\t\t\t\t\t\t</article>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t</section>\n\n\t\t\t\t\t<section class=\"gtp-demo-panel\" id=\"gtp-demo-panel-cache\" role=\"tabpanel\" aria-labelledby=\"gtp-demo-tab-cache\" data-demo-panel=\"cache\" hidden>\n\t\t\t\t\t\t<div class=\"gtp-demo-page-heading\">\n\t\t\t\t\t\t\t<div>\n\t\t\t\t\t\t\t\t<h2>Cache</h2>\n\t\t\t\t\t\t\t\t<p>Control freshness at the origin while visitor browsers remain conservative.</p>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t\t<article class=\"gtp-demo-card\">\n\t\t\t\t\t\t\t<div class=\"gtp-demo-card__header\">\n\t\t\t\t\t\t\t\t<div>\n\t\t\t\t\t\t\t\t\t<h3>One-click presets</h3>\n\t\t\t\t\t\t\t\t\t<p>Choose a starting point, then adjust any value.</p>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t<div class=\"gtp-demo-presets\" role=\"group\" aria-label=\"Cache presets\">\n\t\t\t\t\t\t\t\t<button type=\"button\" aria-pressed=\"true\" data-demo-preset=\"maximum\"><strong>Maximum impact</strong><span>1h fresh · 24h retained</span></button>\n\t\t\t\t\t\t\t\t<button type=\"button\" aria-pressed=\"false\" data-demo-preset=\"balanced\"><strong>Balanced</strong><span>30m fresh · 12h retained</span></button>\n\t\t\t\t\t\t\t\t<button type=\"button\" aria-pressed=\"false\" data-demo-preset=\"dynamic\"><strong>Frequently updated</strong><span>5m fresh · 1h retained</span></button>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t</article>\n\t\t\t\t\t\t<article class=\"gtp-demo-card\">\n\t\t\t\t\t\t\t<div class=\"gtp-demo-card__header\">\n\t\t\t\t\t\t\t\t<div>\n\t\t\t\t\t\t\t\t\t<h3>Origin cache</h3>\n\t\t\t\t\t\t\t\t\t<p>Keep safe public HTML ready on disk so WordPress does less work.</p>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t<div class=\"gtp-demo-fields\">\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\">\n\t\t\t\t\t\t\t\t\t<div><strong>Enable origin page cache</strong><span>Cache eligible public GET requests after WordPress renders them once.</span></div>\n\t\t\t\t\t\t\t\t\t<button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"true\" data-demo-switch=\"cache\"><span aria-hidden=\"true\"></span><b>On</b></button>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\">\n\t\t\t\t\t\t\t\t\t<div><strong>Separate mobile cache</strong><span>Create a mobile variant only when the HTML differs by device.</span></div>\n\t\t\t\t\t\t\t\t\t<button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"false\" data-demo-switch><span aria-hidden=\"true\"></span><b>Off</b></button>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\">\n\t\t\t\t\t\t\t\t\t<div><strong>Cache logged-in users</strong><span>Advanced and normally unsafe for personalized pages.</span></div>\n\t\t\t\t\t\t\t\t\t<button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"false\" data-demo-switch><span aria-hidden=\"true\"></span><b>Off</b></button>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t</article>\n\t\t\t\t\t\t<article class=\"gtp-demo-card\">\n\t\t\t\t\t\t\t<div class=\"gtp-demo-card__header\">\n\t\t\t\t\t\t\t\t<div>\n\t\t\t\t\t\t\t\t\t<h3>Cache lifetime</h3>\n\t\t\t\t\t\t\t\t\t<p>Server retention can be aggressive without locking stale HTML into browsers.</p>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t<div class=\"gtp-demo-fields\">\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\">\n\t\t\t\t\t\t\t\t\t<div><strong>Fresh TTL</strong><span>Before a cached page needs regeneration.</span></div>\n\t\t\t\t\t\t\t\t\t<output data-demo-value=\"fresh\">1 hour</output>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\">\n\t\t\t\t\t\t\t\t\t<div><strong>User and bot retention</strong><span>Safe stale delivery and cache resilience.</span></div>\n\t\t\t\t\t\t\t\t\t<output data-demo-value=\"retention\">24 hours</output>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\">\n\t\t\t\t\t\t\t\t\t<div><strong>Stale if error</strong><span>How long stale HTML may be used when regeneration fails.</span></div>\n\t\t\t\t\t\t\t\t\t<output data-demo-value=\"error\">24 hours</output>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\">\n\t\t\t\t\t\t\t\t\t<div><strong>Browser max-age</strong><span>Conservative client-side HTML lifetime.</span></div>\n\t\t\t\t\t\t\t\t\t<output data-demo-value=\"browser\">5 minutes</output>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t</article>\n\t\t\t\t\t\t<div class=\"gtp-demo-savebar\"><button class=\"gtp-demo-button\" type=\"button\" data-demo-action=\"Cache settings saved in the demo\">Save changes</button></div>\n\t\t\t\t\t</section>\n\n\t\t\t\t\t<section class=\"gtp-demo-panel\" id=\"gtp-demo-panel-optimization\" role=\"tabpanel\" aria-labelledby=\"gtp-demo-tab-optimization\" data-demo-panel=\"optimization\" hidden>\n\t\t\t\t\t\t<div class=\"gtp-demo-page-heading\">\n\t\t\t\t\t\t\t<div>\n\t\t\t\t\t\t\t\t<h2>Optimization</h2>\n\t\t\t\t\t\t\t\t<p>Server-side CSS plus conservative JavaScript, media, font, database, and WordPress controls.</p>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t\t<article class=\"gtp-demo-card\">\n\t\t\t\t\t\t\t<div class=\"gtp-demo-card__header\">\n\t\t\t\t\t\t\t\t<div>\n\t\t\t\t\t\t\t\t\t<h3>Unused CSS</h3>\n\t\t\t\t\t\t\t\t\t<p>Analyze rendered HTML on this server and deliver only matching selectors.</p>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t<div class=\"gtp-demo-fields\">\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\">\n\t\t\t\t\t\t\t\t\t<div><strong>Remove unused CSS</strong><span>Analyze rendered selectors on your server.</span></div>\n\t\t\t\t\t\t\t\t\t<button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"true\" data-demo-switch=\"css\"><span aria-hidden=\"true\"></span><b>On</b></button>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field gtp-demo-field--stacked\">\n\t\t\t\t\t\t\t\t\t<div><strong>CSS delivery</strong><span>Choose how reduced, page-specific CSS is added to the response.</span></div>\n\t\t\t\t\t\t\t\t\t<div class=\"gtp-demo-radio-options\" role=\"radiogroup\" aria-label=\"CSS delivery\">\n\t\t\t\t\t\t\t\t\t\t<label><input type=\"radio\" name=\"gtp-demo-css-mode\" value=\"file\"><span><strong>Generated file</strong><small>Small HTML and a cacheable stylesheet.</small></span></label>\n\t\t\t\t\t\t\t\t\t\t<label><input type=\"radio\" name=\"gtp-demo-css-mode\" value=\"inline\"><span><strong>Inline all used CSS</strong><small>No stylesheet request; complete used CSS repeats in HTML.</small></span></label>\n\t\t\t\t\t\t\t\t\t\t<label><input type=\"radio\" name=\"gtp-demo-css-mode\" value=\"hybrid\" checked><span><strong>Critical inline + remaining file</strong><small>Important early rules inline; the rest stays cacheable.</small></span></label>\n\t\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\">\n\t\t\t\t\t\t\t\t\t<div><strong>Hybrid inline budget</strong><span>Maximum early-page CSS to inline in Hybrid mode.</span></div>\n\t\t\t\t\t\t\t\t\t<label class=\"gtp-demo-input\"><span class=\"gtd-visuallyhidden\">Hybrid inline budget in bytes</span><input type=\"number\" value=\"14336\" min=\"2048\" max=\"51200\"><em>bytes</em></label>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\">\n\t\t\t\t\t\t\t\t\t<div><strong>Preserve dynamic states</strong><span>Keep hover, focus, open, checked, and interactive selectors.</span></div>\n\t\t\t\t\t\t\t\t\t<button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"true\" data-demo-switch><span aria-hidden=\"true\"></span><b>On</b></button>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t</article>\n\n\t\t\t\t\t\t<article class=\"gtp-demo-card\">\n\t\t\t\t\t\t\t<div class=\"gtp-demo-card__header\"><div><h3>JavaScript</h3><p>Apply transformations only to scripts that are not excluded or transactional.</p></div></div>\n\t\t\t\t\t\t\t<div class=\"gtp-demo-fields\">\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Minify local JavaScript</strong><span>Create immutable minified copies of eligible local scripts.</span></div><button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"false\" data-demo-switch><span aria-hidden=\"true\"></span><b>Off</b></button></div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Defer safe JavaScript</strong><span>Add defer to eligible external scripts.</span></div><button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"false\" data-demo-switch><span aria-hidden=\"true\"></span><b>Off</b></button></div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Delay third-party JavaScript</strong><span>Wait for interaction or five seconds before loading matches.</span></div><button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"false\" data-demo-switch><span aria-hidden=\"true\"></span><b>Off</b></button></div>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t</article>\n\n\t\t\t\t\t\t<article class=\"gtp-demo-card\">\n\t\t\t\t\t\t\t<div class=\"gtp-demo-card__header\"><div><h3>Images and embeds</h3><p>Reduce offscreen work and generate modern image variants on this server.</p></div></div>\n\t\t\t\t\t\t\t<div class=\"gtp-demo-fields\">\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Lazy-load non-critical images</strong><span>Keep early images eager and lazy-load later images.</span></div><button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"true\" data-demo-switch><span aria-hidden=\"true\"></span><b>On</b></button></div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Add missing image dimensions</strong><span>Reduce layout shifts when attachment dimensions are known.</span></div><button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"true\" data-demo-switch><span aria-hidden=\"true\"></span><b>On</b></button></div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Critical image count</strong><span>Early images excluded from lazy loading.</span></div><label class=\"gtp-demo-input\"><span class=\"gtd-visuallyhidden\">Critical image count</span><input type=\"number\" value=\"2\" min=\"0\" max=\"10\"><em>images</em></label></div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Generate optimized variants</strong><span>Create the selected ticle class=\"gtp-demo-card\">\n\t\t\t\t\t\t\t<div class=\"gtp-demo-card__header\"><div><h3>WordPress exceptions</h3><p>Keep Google Maps on URLs that need it while disabling the script elsewhere.</p></div></div>\n\t\t\t\t\t\t\t<div class=\"gtp-demo-fields\"><div class=\"gtp-demo-field\"><div><strong>Google Maps path exceptions</strong><span>One path fragment per line.</span></div><label class=\"gtp-demo-textarea\"><span class=\"gtd-visuallyhidden\">Google Maps path exceptions</span><textarea rows=\"3\">/contact/\n/store-locator/</textarea></label></div></div>\n\t\t\t\t\t\t</article>\n\t\t\t\t\t\t<div class=\"gtp-demo-savebar\"><button class=\"gtp-demo-button\" type=\"button\" data-demo-action=\"Exception settings saved in the demo\">Save changes</button></div>\n\t\t\t\t\t</section>\n\n\t\t\t\t\t<section class=\"gtp-demo-panel\" id=\"gtp-demo-panel-cloudflare\" role=\"tabpanel\" aria-labelledby=\"gtp-demo-tab-cloudflare\" data-demo-panel=\"cloudflare\" hidden>\n\t\t\t\t\t\t<div class=\"gtp-demo-page-heading\">\n\t\t\t\t\t\t\t<div>\n\t\t\t\t\t\t\t\t<h2>Cloudflare</h2>\n\t\t\t\t\t\t\t\t<p>Connect the Free plan, synchronize one managed cache rule, and purge exact paths.</p>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t<span class=\"gtp-demo-badge gtp-demo-badge--success\" data-demo-cloudflare-badge>Connected</span>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t\t<article class=\"gtp-demo-card\">\n\t\t\t\t\t\t\t<div class=\"gtp-demo-card__header\">\n\t\t\t\t\t\t\t\t<div>\n\t\t\t\t\t\t\t\t\t<h3>Connection</h3>\n\t\t\t\t\t\t\t\t\t<p>Use a scoped API token or a Global API Key with account email.</p>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t<div class=\"gtp-demo-fields\">\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\">\n\t\t\t\t\t\t\t\t\t<div><strong>Enable Cloudflare integration</strong><span>Allow GT Performance to purge and maintain its managed Cache Rule.</span></div>\n\t\t\t\t\t\t\t\t\t<button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"true\" data-demo-switch><span aria-hidden=\"true\"></span><b>On</b></button>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\">\n\t\t\t\t\t\t\t\t\t<div><strong>Authentication</strong><span>Use a token limited to Zone Read, Cache Rules Edit, and Cache Purge.</span></div>\n\t\t\t\t\t\t\t\t\t<label class=\"gtp-demo-select\"><span class=\"gtd-visuallyhidden\">Authentication method</span><select data-demo-auth><option>Scoped API token (recommended)</option><option>Global API Key (legacy)</option></select></label>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\">\n\t\t\t\t\t\t\t\t\t<div><strong>Scoped API token</strong><span>Saved credentials are encrypted and never displayed again.</span></div>\n\t\t\t\t\t\t\t\t\t<label class=\"gtp-demo-input\"><span class=\"gtd-visuallyhidden\">Scoped API token</span><input type=\"password\" value=\"\" placeholder=\"Saved token\"></label>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\">\n\t\t\t\t\t\t\t\t\t<div><strong>Global API Key</strong><span>Legacy authentication also requires the account email.</span></div>\n\t\t\t\t\t\t\t\t\t<label class=\"gtp-demo-input\"><span class=\"gtd-visuallyhidden\">Global API Key</span><input type=\"password\" value=\"\" placeholder=\"Saved key\"></label>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\">\n\t\t\t\t\t\t\t\t\t<div><strong>Cloudflare account email</strong><span>Required only with Global API Key authentication.</span></div>\n\t\t\t\t\t\t\t\t\t<label class=\"gtp-demo-input\"><span class=\"gtd-visuallyhidden\">Cloudflare account email</span><input type=\"email\" value=\"owner@example.com\"></label>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\">\n\t\t\t\t\t\t\t\t\t<div><strong>Domain</strong><span>The zone protected by GT Performance.</span></div>\n\t\t\t\t\t\t\t\t\t<label class=\"gtp-demo-input\"><span class=\"gtd-visuallyhidden\">Cloudflare domain</span><input type=\"text\" value=\"example.com\"></label>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\">\n\t\t\t\t\t\t\t\t\t<div><strong>Zone ID</strong><span>Optional. A direct ID avoids the discovery request.</span></div>\n\t\t\t\t\t\t\t\t\t<label class=\"gtp-demo-input\"><span class=\"gtd-visuallyhidden\">Cloudflare Zone ID</span><input type=\"text\" value=\"\" placeholder=\"Discover automatically\"></label>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\">\n\t\t\t\t\t\t\t\t\t<div><strong>Edge TTL</strong><span>How long eligible public HTML may remain fresh at Cloudflare.</span></div>\n\t\t\t\t\t\t\t\t\t<label class=\"gtp-demo-input\"><span class=\"gtd-visuallyhidden\">Cloudflare edge TTL in seconds</span><input type=\"number\" value=\"86400\" min=\"0\" max=\"31536000\"><em>seconds</em></label>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\">\n\t\t\t\t\t\t\t\t\t<div><strong>Managed Cache Rule</strong><span>Commerce bypasses and public caching are synchronized.</span></div>\n\t\t\t\t\t\t\t\t\t<strong class=\"gtp-demo-state gtp-demo-state--success\">Active</strong>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t<div class=\"gtp-demo-card__actions\">\n\t\t\t\t\t\t\t\t<button class=\"gtp-demo-button\" type=\"button\" data-demo-cloudflare>Test connection</button>\n\t\t\t\t\t\t\t\t<button class=\"gtp-demo-button gtp-demo-button--secondary\" type=\"button\" data-demo-action=\"Cloudflare settings saved\">Save changes</button>\n\t\t\t\t\t\t\t\t<button class=\"gtp-demo-button gtp-demo-button--secondary\" type=\"button\" data-demo-action=\"Cloudflare rule synchronized\">Connect/sync Cloudflare</button>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t</article>\n\t\t\t\t\t</section>\n\n\t\t\t\t\t<section class=\"gtp-demo-panel\" id=\"gtp-demo-panel-integrations\" role=\"tabpanel\" aria-labelledby=\"gtp-demo-tab-integrations\" data-demo-panel=\"integrations\" hidden>\n\t\t\t\t\t\t<div class=\"gtp-demo-page-heading\">\n\t\t\t\t\t\t\t<div>\n\t\t\t\t\t\t\t\t<h2>Integrations</h2>\n\t\t\t\t\t\t\t\t<p>Coordinate optimization ownership, commerce state, services, and a persistent Redis object cache.</p>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t\t<article class=\"gtp-demo-card\">\n\t\t\t\t\t\t\t<div class=\"gtp-demo-card__header\"><div><h3>Optimization ownership</h3><p>Known overlap is coordinated instead of rewriting the same response twice.</p></div></div>\n\t\t\t\t\t\t\t<div class=\"gtp-demo-fields\">\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Automatic conflict protection</strong><span>Detect performance plugins and preserve known dynamic state.</span></div><button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"true\" data-demo-switch><span aria-hidden=\"true\"></span><b>On</b></button></div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Perfmatters ownership</strong><span>Choose the owner for overlapping front-end optimization.</span></div><label class=\"gtp-demo-select\"><span class=\"gtd-visuallyhidden\">Perfmatters ownership</span><select><option>Automatic per feature (recommended)</option><option>GT Performance owns optimization</option><option>Perfmatters owns optimization</option></select></label></div>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t</article>\n\t\t\t\t\t\t<article class=\"gtp-demo-card\">\n\t\t\t\t\t\t\t<div class=\"gtp-demo-card__header\"><div><h3>Service safeguards</h3><p>Protections activate only when the matching plugin is active.</p></div></div>\n\t\t\t\t\t\t\t<div class=\"gtp-demo-fields\">\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Akismet compatibility</strong><span>Keep privacy and anti-spam assets during CSS or JavaScript optimization.</span></div><button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"true\" data-demo-switch><span aria-hidden=\"true\"></span><b>On</b></button></div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Jetpack compatibility</strong><span>Protect forms, comments, subscriptions, search, VideoPress, and visitor state.</span></div><button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"true\" data-demo-switch><span aria-hidden=\"true\"></span><b>On</b></button></div>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t</article>\n\t\t\t\t\t\t<article class=\"gtp-demo-card\">\n\t\t\t\t\t\t\t<div class=\"gtp-demo-card__header\"><div><h3>Commerce safeguards</h3><p>Active integrations contribute bypass routes, cookies, parameters, and invalidation rules.</p></div></div>\n\t\t\t\t\t\t\t<div class=\"gtp-demo-fields\">\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>FluentCart</strong><span>Protect cart, checkout, account, orders, receipts, licenses, and customer sessions.</span></div><button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"true\" data-demo-switch><span aria-hidden=\"true\"></span><b>On</b></button></div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Easy Digital Downloads</strong><span>Protect checkout, purchase history, receipts, and sessions.</span></div><button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"true\" data-demo-switch><span aria-hidden=\"true\"></span><b>On</b></button></div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>WooCommerce</strong><span>Protect cart, checkout, My Account, orders, fragments, and sessions.</span></div><button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"true\" data-demo-switch><span aria-hidden=\"true\"></span><b>On</b></button></div>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t</article>\n\t\t\t\t\t\t<article class=\"gtp-demo-card\">\n\t\t\t\t\t\t\t<div class=\"gtp-demo-card__header\"><div><h3>Redis object cache</h3><p>PhpRedis credentials with standard Redis Object Cache and GT Performance constant overrides.</p></div></div>\n\t\t\t\t\t\t\t<div class=\"gtp-demo-fields\">\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Enable Redis object cache</strong><span>Use the owned object-cache.php drop-in when no other plugin owns it.</span></div><button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"true\" data-demo-switch><span aria-hidden=\"true\"></span><b>On</b></button></div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Redis host or socket</strong><span>Hostname, IP address, or Unix socket path.</span></div><label class=\"gtp-demo-input\"><span class=\"gtd-visuallyhidden\">Redis host or socket</span><input type=\"text\" value=\"127.0.0.1\"></label></div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Redis port</strong><span>Use 6379 normally, or 0 with a Unix socket.</span></div><label class=\"gtp-demo-input\"><span class=\"gtd-visuallyhidden\">Redis port</span><input type=\"number\" value=\"6379\" min=\"0\" max=\"65535\"></label></div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Redis database</strong><span>Logical Redis database reserved for this site.</span></div><label class=\"gtp-demo-input\"><span class=\"gtd-visuallyhidden\">Redis database</span><input type=\"number\" value=\"0\" min=\"0\" max=\"255\"></label></div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Redis username</strong><span>Optional ACL username.</span></div><label class=\"gtp-demo-input\"><span class=\"gtd-visuallyhidden\">Redis username</span><input type=\"text\" value=\"\" placeholder=\"Optional\"></label></div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Redis password</strong><span>Encrypted in WordPress and masked after save.</span></div><label class=\"gtp-demo-input\"><span class=\"gtd-visuallyhidden\">Redis password</span><input type=\"password\" value=\"\" placeholder=\"Saved password\"></label></div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Use TLS</strong><span>Connect with tls:// when encrypted transport is required.</span></div><button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"false\" data-demo-switch><span aria-hidden=\"true\"></span><b>Off</b></button></div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Persistent connection</strong><span>Reuse the PhpRedis connection between requests.</span></div><button class=\"gtp-demo-switch\" type=\"button\" role=\"switch\" aria-checked=\"true\" data-demo-switch><span aria-hidden=\"true\"></span><b>On</b></button></div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Cache key prefix</strong><span>Leave blank for an automatic site-specific prefix.</span></div><label class=\"gtp-demo-input\"><span class=\"gtd-visuallyhidden\">Redis cache key prefix</span><input type=\"text\" value=\"gtp:site:\"></label></div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Connection timeout</strong><span>Fail back quickly when Redis is unavailable.</span></div><label class=\"gtp-demo-input\"><span class=\"gtd-visuallyhidden\">Redis connection timeout</span><input type=\"number\" value=\"0.5\" min=\"0.1\" max=\"10\" step=\"0.1\"><em>seconds</em></label></div>\n\t\t\t\t\t\t\t\t<div class=\"gtp-demo-field\"><div><strong>Read timeout</strong><span>Maximum time to wait for a Redis response.</span></div><label class=\"gtp-demo-input\"><span class=\"gtd-visuallyhidden\">Redis read timeout</span><input type=\"number\" value=\"0.5\" min=\"0.1\" max=\"10\" step=\"0.1\"><em>seconds</em></label></div>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t<div class=\"gtp-demo-card__actions\">\n\t\t\t\t\t\t\t\t<button class=\"gtp-demo-button\" type=\"button\" data-demo-action=\"Redis settings saved\">Save changes</button>\n\t\t\t\t\t\t\t\t<button class=\"gtp-demo-button gtp-demo-button--secondary\" type=\"button\" data-demo-action=\"Redis connection is healthy\">Test Redis connection</button>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t</article>\n\t\t\t\t\t\t<article class=\"gtp-demo-card\">\n\t\t\t\t\t\t\t<div class=\"gtp-demo-card__header\"><div><h3>Compatible wp-config.php overrides</h3><p>GT Performance reads WP_REDIS_* and GTP_REDIS_* constants, with GTP values taking precedence.</p></div></div>\n\t\t\t\t\t\t\t<pre class=\"gtp-demo-config\"><code>define( 'WP_REDIS_HOST', '127.0.0.1' );\ndefine( 'WP_REDIS_PORT', 6379 );\ndefine( 'WP_REDIS_DATABASE', 0 );\ndefine( 'WP_REDIS_PREFIX', 'gtp:site:' );\ndefine( 'WP_REDIS_TIMEOUT', 0.5 );</code></pre>\n\t\t\t\t\t\t</article>\n\t\t\t\t\t\t<div class=\"gtp-demo-subheading\"><h3>Detected plugin compatibility</h3><p>Foreign cache drop-ins are never overwritten; active owners that need review are flagged.</p></div>\n\t\t\t\t\t\t<div class=\"gtp-demo-integrations\">\n\t\t\t\t\t\t\t<article><span class=\"gtp-demo-initials\">PM</span><div><h3>Perfmatters</h3><p>Coordinates unused CSS, JavaScript, and front-end ownership.</p></div><strong class=\"gtp-demo-state gtp-demo-state--warning\">Coordinated</strong></article>\n\t\t\t\t\t\t\t<article><span class=\"gtp-demo-initials\">FP</span><div><h3>FlyingPress</h3><p>Detected as another full-page cache and optimization owner.</p></div><strong class=\"gtp-demo-state\">Not active</strong></article>\n\t\t\t\t\t\t\t<article><span class=\"gtp-demo-initials\">WPR</span><div><h3>WP Rocket</h3><p>Detected as another full-page cache and optimization owner.</p></div><strong class=\"gtp-demo-state\">Not active</strong></article>\n\t\t\t\t\t\t\t<article><span class=\"gtp-demo-initials\">LS</span><div><h3>LiteSpeed Cache</h3><p>Detected as another full-page cache and optimization owner.</p></div><strong class=\"gtp-demo-state\">Not active</strong></article>\n\t\t\t\t\t\t\t<article><span class=\"gtp-demo-initials\">WPSC</span><div><h3>WP Super Cache</h3><p>Detected as another full-page cache owner.</p></div><strong class=\"gtp-demo-state\">Not active</strong></article>\n\t\t\t\t\t\t\t<article><span class=\"gtp-demo-initials\">W3</span><div><h3>W3 Total Cache</h3><p>Detected as another page and object cache owner.</p></div><strong class=\"gtp-demo-state\">Not active</strong></article>\n\t p>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t\t<article class=\"gtp-demo-card\">\n\t\t\t\t\t\t\t<div class=\"gtp-demo-card__header\"><div><h3>Runtime status</h3><p>GT Performance never overwrites a drop-in owned by another plugin.</p></div></div>\n\t\t\t\t\t\t\t<ul class=\"gtp-demo-status-list\" role=\"list\">\n\t\t\t\t\t\t\t\t<li><span>Page-cache drop-in</span><strong class=\"gtp-demo-state gtp-demo-state--success\">Owned</strong></li>\n\t\t\t\t\t\t\t\t<li><span>WP_CACHE</span><strong class=\"gtp-demo-state gtp-demo-state--success\">Enabled</strong></li>\n\t\t\t\t\t\t\t\t<li><span>Redis drop-in</span><strong class=\"gtp-demo-state gtp-demo-state--success\">Owned</strong></li>\n\t\t\t\t\t\t\t\t<li><span>Cache directory</span><strong class=\"gtp-demo-state gtp-demo-state--success\">Writable</strong></li>\n\t\t\t\t\t\t\t</ul>\n\t\t\t\t\t\t</article>\n\t\t\t\t\t\t<div class=\"gtp-demo-tools\">\n\t\t\t\t\t\t\t<article class=\"gtp-demo-card\"><div><h3>Page cache drop-in</h3><p>Install or refresh advanced-cache.php and safely manage WP_CACHE.</p></div><button class=\"gtp-demo-button gtp-demo-button--secondary\" type=\"button\" data-demo-action=\"Page-cache drop-in is installed and owned\">Install page-cache drop-in</button></article>\n\t\t\t\t\t\t\t<article class=\"gtp-demo-card\"><div><h3>Redis object cache</h3><p>Test credentials and install object-cache.php only when no conflict exists.</p></div><button class=\"gtp-demo-button gtp-demo-button--secondary\" type=\"button\" data-demo-action=\"Redis connection is healthy and the drop-in is owned\">Test and install Redis</button></article>\n\t\t\t\t\t\t\t<article class=\"gtp-demo-card\"><div><h3>Purge GT cache</h3><p>Remove origin HTML and generated assets managed by GT Performance.</p></div><button class=\"gtp-demo-button\" type=\"button\" data-demo-action=\"Origin and generated asset caches purged\">Purge GT cache</button></article>\n\t\t\t\t\t\t\t<article class=\"gtp-demo-card\"><div><h3>Cloudflare rule</h3><p>Discover the zone and reconcile the managed Cloudflare Free Cache Rule.</p></div><button class=\"gtp-demo-button gtp-demo-button--secondary\" type=\"button\" data-demo-action=\"Cloudflare managed Cache Rule synchronized\">Connect/sync Cloudflare</button></article>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t\t<article class=\"gtp-demo-card\">\n\t\t\t\t\t\t\t<div class=\"gtp-demo-card__header\"><div><h3>Manual database optimization</h3><p>Select only the permanent cleanup tasks you want to simulate.</p></div><span class=\"gtp-demo-state\">Manual control</span></div>\n\t\t\t\t\t\t\t<div class=\"gtp-demo-database-list\" role=\"group\" aria-label=\"Manual database optimization tasks\">\n\t\t\t\t\t\t\t\t<label><input type=\"checkbox\" checked><span><strong>Post revisions</strong><small>Delete saved revisions.</small></span><b>12</b></label>\n\t\t\t\t\t\t\t\t<label><input type=\"checkbox\" checked><span><strong>Auto-drafts</strong><small>Delete abandoned automatic drafts.</small></span><b>3</b></label>\n\t\t\t\t\t\t\t\t<label><input type=\"checkbox\" checked><span><strong>Spam comments</strong><small>Delete comments marked as spam.</small></span><b>4</b></label>\n\t\t\t\t\t\t\t\t<label><input type=\"checkbox\" checked><span><strong>Trashed posts</strong><small>Delete posts and pages in Trash.</small></span><b>2</b></label>\n\t\t\t\t\t\t\t\t<label><input type=\"checkbox\" checked><span><strong>Trashed comments</strong><small>Delete comments in Trash.</small></span><b>0</b></label>\n\t\t\t\t\t\t\t\t<label><input type=\"checkbox\" checked><span><strong>Expired transients</strong><small>Remove expired temporary cache entries.</small></span><b>6</b></label>\n\t\t\t\t\t\t\t\t<label><input type=\"checkbox\"><span><strong>All transients</strong><small>Clear active and expired temporary caches.</small></span><b>31</b></label>\n\t\t\t\t\t\t\t\t<label><input type=\"checkbox\" checked><span><strong>Database tables</strong><small>Optimize tables with reclaimable space.</small></span><b>0</b></label>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t<div class=\"gtp-demo-database-actions\">\n\t\t\t\t\t\t\t\t<p>These changes are permanent in the plugin. This product demo never touches a database.</p>\n\t\t\t\t\t\t\t\t<button class=\"gtp-demo-button gtp-demo-button--secondary\" type=\"button\" data-demo-action=\"Database simulation completed for the selected tasks\">Run selected optimization</button>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t</article>\n\t\t\t\t\t</section>\n\t\t\t\t</div>\n\t\t\t\t<p class=\"gtp-demo-announcer gtd-visuallyhidden\" role=\"status\" aria-live=\"polite\" data-demo-live></p>\n\t\t\t</div>\n\t\t</div>\n\t</section>\n\n\t<section class=\"gtd gtd-section gtd-section--alt\" aria-labelledby=\"gt-performance-safety-title\">\n\t\t<header class=\"gtd-text gt-performance-section-header\">\n\t\t\t<p class=\"gtd-eyebrow\">Cache correctness first</p>\n\t\t\t<h2 class=\"gtd-headline\" id=\"gt-performance-safety-title\">Cache speed without cache risk.</h2>\n\t\t\t<p class=\"gtd-intro gtd-muted\">One shared policy controls what WordPress and Cloudflare may cache, retain, bypass, and purge.</p>\n\t\t</header>\n\t\t<div class=\"gtd-wide gtd-grid gtd-grid--3 gt-performance-bento\">\n\t\t\t<article class=\"gtd-card gtd-span-2\">\n\t\t\t\t<p class=\"gtd-eyebrow\">Public pages</p>\n\t\t\t\t<h3 class=\"gtd-callout\">Cache the HTML visitors share.</h3>\n\t\t\t\t<p class=\"gtd-body gtd-muted\">Atomic files, one-hour freshness, retained stale delivery, ETags, preload, and exact purges.</p>\n\t\t\t</article>\n\t\t\t<article class=\"gtd-card gt-performance-stat\">\n\t\t\t\t<p class=\"gtd-display\">24h</p>\n\t\t\t\t<p class=\"gtd-caption\"><strong>retained delivery</strong> for users and bots</p>\n\t\t\t</article>\n\t\t\t<article class=\"gtd-card\">\n\t\t\t\t<p class=\"gtd-eyebrow\">Private state</p>\n\t\t\t\t<h3 class=\"gtd-callout\">Keep sessions out.</h3>\n\t\t\t\t<p class=\"gtd-body gtd-muted\">Cart, checkout, account, receipt, order, license, and session state always bypass public cache.</p>\n\t\t\t</article>\n\t\t\t<article class=\"gtd-card gtd-span-2\">\n\t\t\t\t<p class=\"gtd-eyebrow\">Precise invalidation</p>\n\t\t\t\t<h3 class=\"gtd-callout\">Purge what changed.</h3>\n\t\t\t\t<p class=\"gtd-body gtd-muted\">Content and product updates invalidate related origin entries and the matching Cloudflare paths.</p>\n\t\t\t</article>\n\t\t</div>\n\t</section>\n\n\t<section class=\"gtd gtd-section\" id=\"gt-performance-controls\" aria-labelledby=\"gt-performance-controls-title\">\n\t\t<header class=\"gtd-text gt-performance-section-header\">\n\t\t\t<p class=\"gtd-eyebrow\">One plugin, clear ownership</p>\n\t\t\t<h2 class=\"gtd-headline\" id=\"gt-performance-controls-title\">Own the performance stack.</h2>\n\t\t\t<p class=\"gtd-intro gtd-muted\">Enable each layer separately and see when another plugin already owns the same optimization.</p>\n\t\t</header>\n\t\t<ul class=\"gtd-content gt-performance-feature-list\" role=\"list\">\n\t\t\t<li>\n\t\t\t\t<h3 class=\"gtd-callout\">Origin page cache</h3>\n\t\t\t\t<p class=\"gtd-body gtd-muted\">Owned drop-in, deterministic keys, stale retention, conditional responses, warming, and purges.</p>\n\t\t\t</li>\n\t\t\t<li>\n\t\t\t\t<h3 class=\"gtd-callout\">Cloudflare Free</h3>\n\t\t\t\t<p class=\"gtd-body gtd-muted\">Scoped token or Global API Key, zone discovery, managed Cache Rule, edge TTLs, and exact purge.</p>\n\t\t\t</li>\n\t\t\t<li>\n\t\t\t\t<h3 class=\"gtd-callout\">Unused CSS</h3>\n\t\t\t\t<p class=\"gtd-body gtd-muted\">Server-side selector analysis with file, inline, or critical-inline-plus-file delivery.</p>\n\t\t\t</li>\n\t\t\t<li>\n\t\t\t\t<h3 class=\"gtd-callout\">Redis object cache</h3>\n\t\t\t\t<p class=\"gtd-body gtd-muted\">ACL, TLS, database, prefixes, timeouts, connection tests, and guarded drop-in ownership.</p>\n\t\t\t</li>\n\t\t\t<li>\n\t\t\t\t<h3 class=\"gtd-callout\">WordPress tools</h3>\n\t\t\t\t<p class=\"gtd-body gtd-muted\">Manual and scheduled database cleanup, Heartbeat controls, revisions, autosave, and request removal.</p>\n\t\t\t</li>\n\t\t\t<li>\n\t\t\t\t<h3 class=\"gtd-callout\">Conflict detection</h3>\n\t\t\t\t<p class=\"gtd-body gtd-muted\">Perfmatters, Jetpack, Akismet, cache plugins, and foreign drop-ins report overlapping ownership.</p>\n\t\t\t</li>\n\t\t</ul>\n\t</section>\n\n\t<section class=\"gtd gtd-section\" aria-labelledby=\"gt-performance-css-title\">\n\t\t<header class=\"gtd-text gt-performance-section-header\">\n\t\t\t<p class=\"gtd-eyebrow\">Unused CSS, processed locally</p>\n\t\t\t<h2 class=\"gtd-headline\" id=\"gt-performance-css-title\">Used CSS, delivered your way.</h2>\n\t\t\t<p class=\"gtd-intro gtd-muted\">The final anonymous page is analyzed on your server and falls back to original styles whenever generation cannot finish safely.</p>\n\t\t</header>\n\t\t<ul class=\"gtd-content gt-performance-checks\" role=\"list\">\n\t\t\t<li><strong>Generated file</strong><span>Cacheable CSS with no large inline payload.</span></li>\n\t\t\t<li><strong>Inline used CSS</strong><span>One self-contained response when that fits the page.</span></li>\n\t\t\t<li><strong>Critical plus file</strong><span>Important rules inline, remaining rules in a generated file.</span></li>\n\t\t\t<li><strong>Flexible safelist</strong><span>Partial matches and validated regular expressions.</span></li>\n\t\t</ul>\n\t</section>\n\n\t<section class=\"gtd gtd-section gtd-section--alt\" aria-labelledby=\"gt-performance-commerce-title\">\n\t\t<header class=\"gtd-text gt-performance-section-header\">\n\t\t\t<p class=\"gtd-eyebrow\">Commerce is first-class state</p>\n\t\t\t<h2 class=\"gtd-headline\" id=\"gt-performance-commerce-title\">Commerce stays private.</h2>\n\t\t\t<p class=\"gtd-intro gtd-muted\">Each integration contributes routes, cookies, query parameters, and invalidation rules to both cache layers.</p>\n\t\t</header>\n\t\t<div class=\"gtd-wide gtd-grid gtd-grid--3\">\n\t\t\t<article class=\"gtd-card\">\n\t\t\t\t<h3 class=\"gtd-callout\">FluentCart</h3>\n\t\t\t\t<p class=\"gtd-body gtd-muted\">Cart, checkout, account, orders, receipts, licenses, and customer state remain dynamic.</p>\n\t\t\t</article>\n\t\t\t<article class=\"gtd-card\">\n\t\t\t\t<h3 class=\"gtd-callout\">Easy Digital Downloads</h3>\n\t\t\t\t<p class=\"gtd-body gtd-muted\">Checkout, receipts, purchase history, sessions, and transactional requests bypass public cache.</p>\n\t\t\t</article>\n\t\t\t<article class=\"gtd-card\">\n\t\t\t\t<h3 class=\"gtd-callout\">WooCommerce</h3>\n\t\t\t\t<p class=\"gtd-body gtd-muted\">Cart, checkout, My Account, orders, fragments, and session cookies stay private.</p>\n\t\t\t</article>\n\t\t\t<article class=\"gtd-card gtd-span-2\">\n\t\t\t\t<p class=\"gtd-eyebrow\">Shared ownership</p>\n\t\t\t\t<h3 class=\"gtd-callout\">Plugins stop fighting.</h3>\n\t\t\t\t<p class=\"gtd-body gtd-muted\">Perfmatters ownership controls and safeguards for Jetpack, Akismet, and existing cache plugins prevent duplicate response rewriting.</p>\n\t\t\t</article>\n\t\t\t<article class=\"gtd-card gt-performance-stat\">\n\t\t\t\t<p class=\"gtd-display\">2</p>\n\t\t\t\t<p class=\"gtd-caption\"><strong>cache layers</strong> governed by one commerce policy</p>\n\t\t\t</article>\n\t\t</div>\n\t</section>\n\n\t<section class=\"gtd gtd-section\" aria-labelledby=\"gt-performance-setup-title\">\n\t\t<header class=\"gtd-text gt-performance-section-header\">\n\t\t\t<p class=\"gtd-eyebrow\">A setup you can audit</p>\n\t\t\t<h2 class=\"gtd-headline\" id=\"gt-performance-setup-title\">Start safe. Then go faster.</h2>\n\t\t\t<p class=\"gtd-intro gtd-muted\">Verify one performance layer before enabling the next transformation.</p>\n\t\t</header>\n\t\t<ol class=\"gtd-content gt-performance-steps\" role=\"list\">\n\t\t\t<li class=\"gtd-card gtd-card--tonal\">\n\t\t\t\t<span aria-hidden=\"true\">01</span>\n\t\t\t\t<div>\n\t\t\t\t\t<h3 class=\"gtd-callout\">Install the owned page cache</h3>\n\t\t\t\t\t<p class=\"gtd-body gtd-muted\">GT Performance checks ownership and leaves another plugin's drop-in untouched.</p>\n\t\t\t\t</div>\n\t\t\t</li>\n\t\t\t<li class=\"gtd-card gtd-card--tonal\">\n\t\t\t\t<span aria-hidden=\"true\">02</span>\n\t\t\t\t<div>\n\t\t\t\t\t<h3 class=\"gtd-callout\">Verify MISS, HIT, and bypass</h3>\n\t\t\t\t\t<p class=\"gtd-body gtd-muted\">Confirm an anonymous hit while checkout, account, and personalized requests stay dynamic.</p>\n\t\t\t\t</div>\n\t\t\t</li>\n\t\t\t<li class=\"gtd-card gtd-card--tonal\">\n\t\t\t\t<span aria-hidden=\"true\">03</span>\n\t\t\t\t<div>\n\t\t\t\t\t<h3 class=\"gtd-callout\">Connect Cloudflare Free</h3>\n\t\t\t\t\t<p class=\"gtd-body gtd-muted\">Synchronize one managed rule, then verify edge hits and exact purges.</p>\n\t\t\t\t</div>\n\t\t\t</li>\n\t\t\t<li class=\"gtd-card gtd-card--tonal\">\n\t\t\t\t<span aria-hidden=\"true\">04</span>\n\t\t\t\t<div>\n\t\t\t\t\t<h3 class=\"gtd-callout\">Add transformations gradually</h3>\n\t\t\t\t\t<p class=\"gtd-body gtd-muted\">Test CSS, JavaScript, media, Redis, and database controls one layer at a time.</p>\n\t\t\t\t</div>\n\t\t\t</li>\n\t\t</ol>\n\t</section>\n\n\t<section class=\"gtd gtd-section gtd-section--tight\" aria-labelledby=\"gt-performance-alpha-title\">\n\t\t<div class=\"gtd-text gt-performance-alpha\">\n\t\t\t<p class=\"gtd-eyebrow\">Controlled alpha</p>\n\t\t\t<h2 class=\"gtd-headline\" id=\"gt-performance-alpha-title\">Test before production.</h2>\n\t\t\t<blockquote>\n\t\t\t\t<p class=\"gtd-intro gtd-intro--serif\">“Cache plugins do not deserve blind trust.”</p>\n\t\t\t</blockquote>\n\t\t\t<p class=\"gtd-body gtd-muted\">Keep a backup, begin on staging, test checkout and account flows, and enable aggressive frontend transformations only after the core cache path is stable.</p>\n\t\t</div>\n\t</section>\n\n\t<section class=\"gtd gtd-section gtd-section--alt\" id=\"gt-performance-faq\" aria-labelledby=\"gt-performance-faq-title\">\n\t\t<header class=\"gtd-text gt-performance-section-header\">\n\t\t\t<p class=\"gtd-eyebrow\">The important details</p>\n\t\t\t<h2 class=\"gtd-headline\" id=\"gt-performance-faq-title\">Questions, answered.</h2>\n\t\t</header>\n\t\t<div class=\"gtd-text gt-performance-faq\">\n\t\t\t<details>\n\t\t\t\t<summary class=\"gtd-callout\">Does Cloudflare require a paid plan?</summary>\n\t\t\t\t<p class=\"gtd-body gtd-muted\">No. The baseline uses Cache Rules and targeted purges available on Cloudflare Free; APO, Workers, Cache Reserve, Argo, and Enterprise are not required.</p>\n\t\t\t</details>\n\t\t\t<details>\n\t\t\t\t<summary class=\"gtd-callout\">Does unused CSS leave my server?</summary>\n\t\t\t\t<p class=\"gtd-body gtd-muted\">No. Stylesheet collection, selector analysis, pruning, artifact creation, and reporting run on the WordPress server.</p>\n\t\t\t</details>\n\t\t\t<details>\n\t\t\t\t<summary class=\"gtd-callout\">Can GT Performance work with Perfmatters?</summary>\n\t\t\t\t<p class=\"gtd-body gtd-muted\">Yes. Choose which plugin owns overlapping frontend work; GT Performance reports active owners instead of letting both plugins rewrite the same response.</p>\n\t\t\t</details>\n\t\t\t<details>\n\t\t\t\t<summary class=\"gtd-callout\">What happens when another cache plugin owns a drop-in?</summary>\n\t\t\t\t<p class=\"gtd-body gtd-muted\">GT Performance reports the conflict and refuses to overwrite a foreign <code>advanced-cache.php</code> or <code>object-cache.php</code> file.</p>\n\t\t\t</details>\n\t\t\t<details>\n\t\t\t\t<summary class=\"gtd-callout\">How are updates delivered?</summary>\n\t\t\t\t<p class=\"gtd-body gtd-muted\">Activate the FluentCart license for your site; WordPress receives version details normally and the protected package only while that site activation is valid.</p>\n\t\t\t</details>\n\t\t\t<details>\n\t\t\t\t<summary class=\"gtd-callout\">What does the $199 license include?</summary>\n\t\t\t\t<p class=\"gtd-body gtd-muted\">The one-time purchase covers every GT Performance module, 25 WordPress websites, a lifetime license, and protected updates inside WordPress.</p>\n\t\t\t</details>\n\t\t</div>\n\t</section>\n\n\t<section class=\"gtd gtd-section gtd-section--dark gt-performance-closing\" aria-labelledby=\"gt-performance-closing-title\">\n\t\t<div class=\"gtd-text\">\n\t\t\t<p class=\"gtd-eyebrow\">One clear price</p>\n\t\t\t<h2 class=\"gtd-headline\" id=\"gt-performance-closing-title\">25 websites. Every module.</h2>\n\t\t\t<p class=\"gtd-intro gtd-muted\">Get page caching, Cloudflare Free, unused CSS, Redis, WordPress tools, and commerce safeguards under one lifetime license.</p>\n\t\t\t<div class=\"gt-performance-closing__price\" role=\"group\" aria-label=\"One-time price of 199 dollars\">\n\t\t\t\t<strong>$199</strong>\n\t\t\t\t<span>one-time · 25 websites · lifetime license</span>\n\t\t\t</div>\n\t\t\t<div class=\"gtd-actions gt-performance-actions\">\n\t\t\t\t<a class=\"gtd-button gtd-button--large\" href=\"https://gauravtiwari.org/?fluent-cart=instant_checkout&item_id=68&quantity=1\">Continue to secure checkout</a>\n\t\t\t\t<a class=\"gtd-cta-link\" href=\"#gt-performance-faq\">Review common questions</a>\n\t\t\t</div>\n\t\t\t<p class=\"gtd-footnote\">GT Performance is currently an alpha release. Test it on staging before using it on a production store.</p>\n\t\t</div>\n\t</section>\n</div>\n","css":"/* ==========================================================================\n   GT DESIGN SYSTEM (GTDS) — token layer + primitives\n   Apple Design System structure wearing the Gaurav Tiwari / MD brand.\n   Scope: every section carries the `gtd` class.\n   Every color/font/space token references the live MD theme variable with a\n   hard fallback (live values, gauravtiwari.org, July 2026) — so on-site the\n   theme options + [data-theme=\"dark\"] drive it, and standalone it still works.\n   ========================================================================== */\n\n.gtd {\n  /* ---- Color (MD bridge) ---- */\n  --gtd-canvas: var(--color-bg, #FFFFFC);\n  --gtd-canvas-alt: var(--neutral-50, #F8F6F5);            /* GT's #f5f5f7: primary-tinted near-white */\n  --gtd-surface: var(--color-content-bg, #FFFFFE);          /* card on alt canvas */\n  --gtd-surface-tonal: var(--neutral-100, #F3F0EF);         /* card on white canvas */\n  --gtd-ink: var(--color-headline, #212121);\n  --gtd-ink-body: var(--color-text, #212121);\n  --gtd-ink-secondary: var(--color-text-sec, #262A5D);\n  --gtd-ink-tertiary: var(--neutral-500, #8A8380);\n  --gtd-link: var(--color-links, #C0392B);\n  --gtd-primary: var(--color-primary, #C0392B);\n  --gtd-accent: var(--color-accent, #F59E0B);\n  --gtd-fill: var(--color-button, #C0392B);                 /* filled button */\n  --gtd-fill-text: var(--color-button-text, #FFFFFE);\n  --gtd-fill-hover: var(--primary-shade-soft, #AD3327);\n  --gtd-tint-soft: var(--primary-tint-soft, #F9E7E5);       /* secondary button bg */\n  --gtd-hairline: color-mix(in srgb, var(--color-border, #DDDDDD), transparent 20%);\n  --gtd-hairline-soft: color-mix(in srgb, var(--color-border, #DDDDDD), transparent 55%);\n\n  /* ---- Type (brand faces, Apple scale logic) ---- */\n  --gtd-font-head: var(--font-head, GTReallySans, system-ui, sans-serif);\n  --gtd-font-body: var(--font-body, \"FinlandikaPro\", system-ui, sans-serif);\n  --gtd-font-serif: var(--font-serif, TiemposText, Georgia, serif);\n  --gtd-font-mono: var(--font-mono, \"SF Mono\", SFMono-Regular, Consolas, monospace);\n\n  /* Marketing scale: larger than blog defaults, capped below Apple's 80px\n     because Really Sans Black carries more weight than SF semibold */\n  --gtd-fs-display: clamp(2.5rem, 1.9rem + 2.7vw, 4.25rem);   /* 40 → 68px */\n  --gtd-fs-headline: clamp(2rem, 1.65rem + 1.55vw, 2.8125rem);/* 32 → 45px = site h1 max */\n  --gtd-fs-title: clamp(1.625rem, 1.49rem + 0.63vw, 2rem);    /* 26 → 32px */\n  --gtd-fs-callout: clamp(1.3125rem, 1.24rem + 0.31vw, 1.5rem); /* 21 → 24px */\n  --gtd-fs-intro: clamp(1.1875rem, 1.14rem + 0.2vw, 1.3125rem); /* 19 → 21px */\n  --gtd-fs-body: var(--fs-base, 1.0625rem);                   /* 17px — MD base = Apple body */\n  --gtd-fs-caption: 0.875rem;                                 /* 14px — fixed for hierarchy */\n  --gtd-fs-footnote: 0.75rem;                                 /* 12px — fixed for hierarchy */\n  --gtd-fs-eyebrow: 0.6875rem;                                /* 11px — MD author-eyebrow */\n  /* Content hierarchy ladder (desktop): 68 › 45 › 32 › 24 › 21 › 17 › 14 › 12 › 11.\n     Every text element maps to exactly one role. Never invent an in-between\n     size, never let two adjacent roles render within 2px of each other. */\n\n  /* Tracking: ZERO on Really Sans (house rule), quiet elsewhere */\n  --gtd-track-head: 0;\n  --gtd-track-body: 0;\n  --gtd-track-eyebrow: 0.1em;\n\n  --gtd-lh-display: 1.06;\n  --gtd-lh-headline: 1.14;\n  --gtd-lh-title: 1.2;\n  --gtd-lh-intro: 1.45;\n  --gtd-lh-body: var(--lh-base, 1.55);\n  --gtd-lh-tight: var(--lh-tight, 1.25);\n\n  --gtd-weight-head: 900;        /* Really Sans Black — the loaded face */\n  --gtd-weight-subhead: 600;     /* Finlandica semibold for h4-level titles */\n  --gtd-weight: 400;\n\n  /* ---- Rhythm (Apple structure; --space-quad ≈ Apple's 112px) ---- */\n  --gtd-section-pad: clamp(var(--space-quad, 7.25rem), 6rem + 2.2vw, 9rem);\n  --gtd-section-pad-tight: clamp(4.5rem, 4rem + 1.4vw, var(--space-triple, 5.4375rem));\n  --gtd-header-gap: clamp(2rem, 1.6rem + 1.6vw, 3rem);\n  --gtd-stack: 0.4em;\n  --gtd-stack-copy: 0.8em;\n  --gtd-stack-headline: 1.2em;\n  --gtd-stack-loose: 1.6em;\n\n  /* ---- Layout (MD rails) ---- */\n  --gtd-measure-text: 46rem;                                  /* 736px lockup/prose rail */\n  --gtd-measure-content: var(--content-width, 1050px);\n  --gtd-measure-wide: var(--wide, 1250px);\n  --gtd-gutter: var(--space-half, 0.9375rem);\n  --gtd-gutter-mid: var(--space-single, 1.8125rem);\n  --gtd-gutter-loose: var(--space-mid, 2.75rem);\n  --gtd-viewport-pad: max(22px, env(safe-area-inset-left));\n\n  /* ---- Shape ---- */\n  --gtd-radius-s: var(--radius-m, 0.5rem);\n  --gtd-radius-m: var(--radius-l, 0.75rem);\n  --gtd-radius-l: var(--radius-xl, 1rem);\n  --gtd-radius-card: 1.75rem;                                 /* Apple 28px card, kept */\n  --gtd-radius-btn: var(--radius-s, 0.25rem);                 /* 4px — GT buttons are squared, never pills */\n\n  /* ---- Elevation (MD shadows; imagery only) ---- */\n  --gtd-shadow-float: var(--shadow-lg, 0 12px 32px rgba(0, 0, 0, 0.12));\n  --gtd-shadow-frame: var(--shadow-sm, 0 1px 2px rgba(0, 0, 0, 0.08));\n\n  /* ---- Motion ---- */\n  --gtd-ease: cubic-bezier(0.25, 1, 0.5, 1);\n  --gtd-duration: 0.28s;\n\n  /* base */\n  font-family: var(--gtd-font-body);\n  color: var(--gtd-ink-body);\n  background-color: var(--gtd-canvas);\n  font-size: var(--gtd-fs-body);\n  line-height: var(--gtd-lh-body);\n  letter-spacing: var(--gtd-track-body);\n  font-weight: var(--gtd-weight);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* ---- Dark mode ----\n   On-site: MD re-maps --color-* under html[data-theme=\"dark\"], so the var()\n   references above go dark automatically. These blocks only swap the literal\n   fallbacks (standalone use) and the mix-based tokens. */\n[data-theme=\"dark\"] .gtd {\n  --gtd-canvas: var(--color-bg, #0F0F0F);\n  --gtd-canvas-alt: var(--color-surface-2, #1A1817);\n  --gtd-surface: var(--color-surface-3, #23201F);\n  --gtd-surface-tonal: var(--color-surface-2, #1A1817);\n  --gtd-ink: var(--color-headline, #fafafa);\n  --gtd-ink-body: var(--color-text, #E4E4E4);\n  --gtd-ink-secondary: var(--color-text-sec, #a1a1aa);\n  --gtd-ink-tertiary: var(--neutral-400, #7a7572);\n  --gtd-link: var(--color-links, #DA946C);\n  --gtd-primary: var(--color-primary, #DA6F55);\n  --gtd-tint-soft: color-mix(in srgb, var(--color-primary, #DA6F55) 16%, transparent);\n  --gtd-hairline: color-mix(in srgb, var(--color-border, #2d2d2d), transparent 10%);\n  --gtd-hairline-soft: color-mix(in srgb, var(--color-border, #2d2d2d), transparent 45%);\n  --gtd-shadow-float: 0 20px 40px rgba(0, 0, 0, 0.55), 0 4px 12px rgba(0, 0, 0, 0.4);\n  --gtd-shadow-frame: 0 1px 2px rgba(0, 0, 0, 0.4);\n}\n@media (prefers-color-scheme: dark) {\n  html:not([data-theme]) .gtd,\n  html[data-theme=\"auto\"] .gtd {\n    --gtd-canvas: var(--color-bg, #0F0F0F);\n    --gtd-canvas-alt: var(--color-surface-2, #1A1817);\n    --gtd-surface: var(--color-surface-3, #23201F);\n    --gtd-surface-tonal: var(--color-surface-2, #1A1817);\n    --gtd-ink: var(--color-headline, #fafafa);\n    --gtd-ink-body: var(--color-text, #E4E4E4);\n    --gtd-ink-secondary: var(--color-text-sec, #a1a1aa);\n    --gtd-ink-tertiary: var(--neutral-400, #7a7572);\n    --gtd-link: var(--color-links, #DA946C);\n    --gtd-primary: var(--color-primary, #DA6F55);\n    --gtd-tint-soft: color-mix(in srgb, var(--color-primary, #DA6F55) 16%, transparent);\n    --gtd-hairline: color-mix(in srgb, var(--color-border, #2d2d2d), transparent 10%);\n    --gtd-hairline-soft: color-mix(in srgb, var(--color-border, #2d2d2d), transparent 45%);\n  }\n}\n\n/* ==========================================================================\n   PRIMITIVES\n   ========================================================================== */\n\n/* ---- Sections ---- */\n.gtd-section {\n  padding-block: var(--gtd-section-pad);\n  padding-inline: var(--gtd-viewport-pad);\n}\n.gtd-section--tight { padding-block: var(--gtd-section-pad-tight); }\n.gtd-section--alt { background-color: var(--gtd-canvas-alt); }\n.gtd-section--flush-top { padding-block-start: 0; }\n.gtd-section--flush-bottom { padding-block-end: 0; }\n\n/* Brand-dark section (independent of theme) */\n.gtd-section--dark {\n  --gtd-canvas: #0F0F0F;\n  --gtd-canvas-alt: #1A1817;\n  --gtd-surface: #23201F;\n  --gtd-surface-tonal: #1A1817;\n  --gtd-ink: #fafafa;\n  --gtd-ink-body: #E4E4E4;\n  --gtd-ink-secondary: #a1a1aa;\n  --gtd-ink-tertiary: #7a7572;\n  --gtd-link: #DA946C;\n  --gtd-primary: #D rgin: 0;\n  font-size: var(--gtd-fs-footnote);\n  line-height: 1.4;\n  color: var(--gtd-ink-tertiary);\n}\n/* Brand eyebrow: MD's uppercase primary label (unlike ADS — GT keeps caps) */\n.gtd-eyebrow {\n  margin: 0 0 0.9em;\n  font-size: var(--gtd-fs-eyebrow);\n  line-height: 1.3;\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: var(--gtd-track-eyebrow);\n  color: var(--gtd-primary);\n}\n.gtd-muted { color: var(--gtd-ink-secondary); }\n.gtd-muted strong, .gtd-caption strong {\n  color: var(--gtd-ink);\n  font-weight: var(--gtd-weight-subhead);\n}\n\n/* Brand gradient moment — max ONE per page: brick → amber */\n.gtd-gradient-text {\n  background: linear-gradient(96deg, var(--gtd-primary) 10%, var(--gtd-accent) 90%);\n  -webkit-background-clip: text;\n  background-clip: text;\n  color: transparent;\n}\n\n/* ---- Stacked margins (Apple lockup rhythm) ---- */\n.gtd-display + .gtd-intro { margin-block-start: var(--gtd-stack-headline); }\n.gtd-headline + .gtd-intro,\n.gtd-headline + .gtd-body,\n.gtd-title + .gtd-body,\n.gtd-callout + .gtd-body { margin-block-start: var(--gtd-stack-copy); }\n.gtd-intro + .gtd-body,\n.gtd-body + .gtd-body,\n.gtd-body + .gtd-caption { margin-block-start: var(--gtd-stack-copy); }\n.gtd-body + .gtd-headline,\n.gtd-body + .gtd-title { margin-block-start: var(--gtd-stack-loose); }\n\n/* ---- Links ---- */\n.gtd a:not(.gtd-button) { color: var(--gtd-link); text-decoration: none; }\n.gtd a:not(.gtd-button):hover { text-decoration: underline; text-underline-offset: 3px; }\n.gtd-cta-link { font-weight: var(--gtd-weight-subhead); white-space: nowrap; }\n.gtd-cta-link::after {\n  content: \"\\203A\";\n  display: inline-block;\n  margin-inline-start: 0.3em;\n  transition: transform var(--gtd-duration) var(--gtd-ease);\n}\n.gtd-cta-link:hover::after { transform: translateX(2px); }\n\n/* ---- Buttons (brand fill, squared 4px corners — never pills; ONE filled per section) ---- */\n.gtd-button {\n  display: inline-block;\n  background ter-mid); }\n.gtd-grid--2 { grid-template-columns: repeat(2, 1fr); }\n.gtd-grid--3 { grid-template-columns: repeat(3, 1fr); }\n.gtd-grid--4 { grid-template-columns: repeat(4, 1fr); }\n.gtd-grid--gap-s { gap: var(--gtd-gutter); }\n.gtd-grid--loose { gap: var(--gtd-gutter-loose); }\n.gtd-span-2 { grid-column: span 2; }\n@media (max-width: 992px) {\n  .gtd-grid--4 { grid-template-columns: repeat(2, 1fr); }\n  .gtd-grid--3 { grid-template-columns: repeat(2, 1fr); }\n}\n@media (max-width: 640px) {\n  .gtd-grid--2, .gtd-grid--3, .gtd-grid--4 { grid-template-columns: 1fr; }\n  .gtd-span-2 { grid-column: auto; }\n}\n\n/* ---- Media ---- */\n.gtd img, .gtd video { max-width: 100%; height: auto; display: block; }\n.gtd-shot { border-radius: var(--gtd-radius-l); }\n.gtd-shot--float { box-shadow: var(--gtd-shadow-float); }\n.gtd-shot--frame {\n  border-radius: var(--gtd-radius-m);\n  box-shadow: var(--gtd-shadow-frame), inset 0 0 0 1px var(--gtd-hairline-soft);\n}\n\n/* ---- Hairline ---- */\n.gtd-hairline { border: 0; border-top: 1px solid var(--gtd-hairline-soft); margin: 0; }\n\n/* ---- Scroll reveal (opt-in; JS adds .is-visible) ---- */\n.gtd-reveal {\n  opacity: 0;\n  transform: translateY(24px);\n  transition: opacity 0.6s var(--gtd-ease), transform 0.6s var(--gtd-ease);\n}\n.gtd-reveal.is-visible { opacity: 1; transform: none; }\n@media (prefers-reduced-motion: reduce) {\n  .gtd-reveal { opacity: 1; transform: none; transition: none; }\n  .gtd-cta-link::after, .gtd-button { transition: none; }\n  .gtd-button:hover { transform: none; }\n}\n\n/* ---- A11y ---- */\n.gtd :focus-visible {\n  outline: 2px solid var(--gtd-link);\n  outline-offset: 3px;\n  border-radius: 4px;\n}\n.gtd-visuallyhidden {\n  position: absolute;\n  width: 1px; height: 1px;\n  clip-path: inset(50%);\n  overflow: hidden;\n  white-space: nowrap;\n}\n\n.gt-performance-page,\n.gt-performance-page *,\n.gt-performance-page *::before,\n.gt-performance-page *::after {\n\tbox-sizing: border-box;\n}\n\n.gt-perf
