<!-- wp:marketers-delight/inline-page-block {"content":"<div class=\"gtp-shop\">\n\t<section class=\"gtp-shop-hero\" aria-labelledby=\"gtp-shop-title\">\n\t\t<div class=\"inner block-double-tb block-half-lr\">\n\t\t\t<div class=\"gtp-shop-hero__grid\">\n\t\t\t\t<div class=\"gtp-shop-hero__copy\">\n\t\t\t\t\t<p class=\"gtp-shop-kicker\">WordPress performance, with cache safety built in</p>\n\t\t\t\t\t<h1 id=\"gtp-shop-title\">Fast public pages. Private carts and accounts.</h1>\n\t\t\t\t\t<p class=\"gtp-shop-lede\">GT Performance combines origin page caching, Cloudflare Free controls, server-side unused CSS, Redis object caching, and WordPress cleanup in one focused plugin.</p>\n\t\t\t\t\t<p>But it starts with a stricter rule: checkout, account, receipt, license, and session state must never become public cache entries.</p>\n\t\t\t\t\t<div class=\"gtp-shop-actions\">\n\t\t\t\t\t\t<a class=\"gtp-shop-button gtp-shop-button--primary\" href=\"#gtp-shop-features\">See the controls</a>\n\t\t\t\t\t\t<a class=\"gtp-shop-button gtp-shop-button--secondary\" href=\"#gtp-shop-alpha\">Read the alpha notes</a>\n\t\t\t\t\t</div>\n\t\t\t\t\t<ul class=\"gtp-shop-tags\" aria-label=\"Core capabilities\">\n\t\t\t\t\t\t<li>Cloudflare Free</li>\n\t\t\t\t\t\t<li>Server-side CSS</li>\n\t\t\t\t\t\t<li>Redis object cache</li>\n\t\t\t\t\t\t<li>Commerce-aware</li>\n\t\t\t\t\t</ul>\n\t\t\t\t</div>\n\t\t\t\t<figure class=\"gtp-shop-hero__visual\">\n\t\t\t\t\t<img src=\"https://r2.gauravtiwari.org/wp-content/uploads/2026/07/screenshot-1.jpg\" alt=\"GT Performance dashboard showing cache, Cloudflare, unused CSS, and Redis status\" width=\"1280\" height=\"720\">\n\t\t\t\t\t<figcaption>One control center for the layers that affect real visitors.</figcaption>\n\t\t\t\t</figure>\n\t\t\t</div>\n\t\t</div>\n\t</section>\n\n\t<section class=\"gtp-shop-section gtp-shop-section--light\" aria-labelledby=\"gtp-shop-safety-title\">\n\t\t<div class=\"inner block-double-tb block-half-lr\">\n\t\t\t<header class=\"gtp-shop-heading\">\n\t\t\t\t<p class=\"gtp-shop-kicker\">Cache correctness first</p>\n\t\t\t\t<h2 id=\"gtp-shop-safety-title\">The wrong cache hit is worse than a slow miss.</h2>\n\t\t\t\t<p>A fast checkout that shows stale cart data is not a performance win. GT Performance compiles commerce routes, visitor cookies, query state, and plugin exceptions into the same origin and Cloudflare policy.</p>\n\t\t\t</header>\n\t\t\t<div class=\"gtp-shop-grid gtp-shop-grid--three\">\n\t\t\t\t<article class=\"gtp-shop-card\">\n\t\t\t\t\t<span class=\"gtp-shop-card__number\">01</span>\n\t\t\t\t\t<h3>Cache public HTML</h3>\n\t\t\t\t\t<p>Atomic page files, one-hour freshness, 24-hour retained delivery, safe stale responses, preload, and exact purges.</p>\n\t\t\t\t</article>\n\t\t\t\t<article class=\"gtp-shop-card\">\n\t\t\t\t\t<span class=\"gtp-shop-card__number\">02</span>\n\t\t\t\t\t<h3>Bypass private state</h3>\n\t\t\t\t\t<p>Cart, checkout, account, receipt, order, license, session-cookie, and transactional query state stay outside public cache.</p>\n\t\t\t\t</article>\n\t\t\t\t<article class=\"gtp-shop-card\">\n\t\t\t\t\t<span class=\"gtp-shop-card__number\">03</span>\n\t\t\t\t\t<h3>Invalidate the right pages</h3>\n\t\t\t\t\t<p>Content and product changes purge related origin entries and synchronize the matching Cloudflare cache path.</p>\n\t\t\t\t</article>\n\t\t\t</div>\n\t\t</div>\n\t</section>\n\n\t<section class=\"gtp-shop-section\" id=\"gtp-shop-features\" aria-labelledby=\"gtp-shop-features-title\">\n\t\t<div class=\"inner block-double-tb block-half-lr\">\n\t\t\t<header class=\"gtp-shop-heading\">\n\t\t\t\t<p class=\"gtp-shop-kicker\">One plugin, clear ownership</p>\n\t\t\t\t<h2 id=\"gtp-shop-features-title\">Control the full WordPress performance stack.</h2>\n\t\t\t\t<p>Each module can be enabled, tested, and rolled back separately. GT Performance also detects competing optimization owners before two plugins start rewriting the same response.</p>\n\t\t\t</header>\n\t\t\t<div class=\"gtp-shop-grid gtp-shop-grid--three\">\n\t\t\t\t<article class=\"gtp-shop-feature\">\n\t\t\t\t\t<h3>Origin page cache</h3>\n\t\t\t\t\t<p>Owned drop-in, deterministic cache keys, stale retention, ETags, conditional responses, purge queue, and cache warming.</p>\n\t\t\t\t</article>\n\t\t\t\t<article class=\"gtp-shop-feature\">\n\t\t\t\t\t<h3>Cloudflare Free</h3>\n\t\t\t\t\t<p>Scoped API token or Global API Key, zone discovery, managed Cache Rule, edge TTLs, exact purge, and portable fallbacks.</p>\n\t\t\t\t</article>\n\t\t\t\t<article class=\"gtp-shop-feature\">\n\t\t\t\t\t<h3>Unused CSS</h3>\n\t\t\t\t\t<p>Server-side selector analysis with generated-file, fully inline, or critical-inline-plus-file delivery.</p>\n\t\t\t\t</article>\n\t\t\t\t<article class=\"gtp-shop-feature\">\n\t\t\t\t\t<h3>Redis object cache</h3>\n\t\t\t\t\t<p>PhpRedis credentials, ACL, TLS, database selection, prefixes, timeouts, connection tests, and guarded drop-in ownership.</p>\n\t\t\t\t</article>\n\t\t\t\t<article class=\"gtp-shop-feature\">\n\t\t\t\t\t<h3>WordPress cleanup</h3>\n\t\t\t\t\t<p>Manual and scheduled database cleanup, request removal, metadata controls, Heartbeat limits, revision policy, and autosave settings.</p>\n\t\t\t\t</article>\n\t\t\t\t<article class=\"gtp-shop-feature\">\n\t\t\t\t\t<h3>Conflict-aware integrations</h3>\n\t\t\t\t\t<p>Ownership coordination for Perfmatters plus safeguards for Jetpack, Akismet, existing cache plugins, and foreign drop-ins.</p>\n\t\t\t\t</article>\n\t\t\t</div>\n\t\t</div>\n\t</section>\n\n\t<section class=\"gtp-shop-section gtp-shop-section--blue\" aria-labelledby=\"gtp-shop-css-title\">\n\t\t<div class=\"inner block-double-tb block-half-lr\">\n\t\t\t<div class=\"gtp-shop-split\">\n\t\t\t\t<div>\n\t\t\t\t\t<p class=\"gtp-shop-kicker\">Unused CSS, processed on your server</p>\n\t\t\t\t\t<h2 id=\"gtp-shop-css-title\">Choose file, inline, or hybrid delivery.</h2>\n\t\t\t\t\t<p>GT Performance reads the final anonymous HTML, collects same-origin stylesheets, parses selectors, and keeps the rules the page actually uses. It returns the original stylesheets if collection, parsing, writing, or serialization fails.</p>\n\t\t\t\t\t<ul class=\"gtp-shop-checks\">\n\t\t\t\t\t\t<li>Partial selector safelist matches</li>\n\t\t\t\t\t\t<li>Validated regular expressions</li>\n\t\t\t\t\t\t<li>Hover, focus, open, and checked states</li>\n\t\t\t\t\t\t<li>Live processing, ready, stale, and failure reports</li>\n\t\t\t\t\t</ul>\n\t\t\t\t</div>\n\t\t\t\t<figure class=\"gtp-shop-report\">\n\t\t\t\t\t<img src=\"https://r2.gauravtiwari.org/wp-content/uploads/2026/07/screenshot-4.jpg\" alt=\"GT Performance unused CSS report with processing, ready, stale, and failed status counts\" width=\"1280\" height=\"720\">\n\t\t\t\t\t<figcaption>Generated output size, savings, delivery mode, and failures stay visible.</figcaption>\n\t\t\t\t</figure>\n\t\t\t</div>\n\t\t</div>\n\t</section>\n\n\t<section class=\"gtp-shop-section gtp-shop-section--light\" aria-labelledby=\"gtp-shop-commerce-title\">\n\t\t<div class=\"inner block-double-tb block-half-lr\">\n\t\t\t<header class=\"gtp-shop-heading\">\n\t\t\t\t<p class=\"gtp-shop-kicker\">Commerce is first-class state</p>\n\t\t\t\t<h2 id=\"gtp-shop-commerce-title\">FluentCart, EDD, and WooCommerce are protected at both cache layers.</h2>\n\t\t\t\t<p>The integration is not a late list of URL exclusions. Each adapter contributes routes, cookies, query parameters, and invalidation rules to the compiled policy used by the origin cache and Cloudflare.</p>\n\t\t\t</header>\n\t\t\t<div class=\"gtp-shop-compat\">\n\t\t\t\t<div><strong>FluentCart</strong><span>Cart, checkout, account, orders, licenses</span></div>\n\t\t\t\t<div><strong>Easy Digital Downloads</strong><span>Checkout, receipts, purchase history, sessions</span></div>\n\t\t\t\t<div><strong>WooCommerce</strong><span>Cart, checkout, My Account, orders, sessions</span></div>\n\t\t\t\t<div><strong>Perfmatters</strong><span>One owner for overlapping optimization work</span></div>\n\t\t\t\t<div><strong>Jetpack and Akismet</strong><span>Dynamic scripts, forms, comments, and visitor state</span></div>\n\t\t\t\t<div><strong>Existing cache plugins</strong><span>Foreign drop-ins are detected and never overwritten</span></div>\n\t\t\t</div>\n\t\t</div>\n\t</section>\n\n\t<section class=\"gtp-shop-section\" aria-labelledby=\"gtp-shop-setup-title\">\n\t\t<div class=\"inner block-double-tb block-half-lr\">\n\t\t\t<header class=\"gtp-shop-heading\">\n\t\t\t\t<p class=\"gtp-shop-kicker\">A setup you can audit</p>\n\t\t\t\t<h2 id=\"gtp-shop-setup-title\">Start with caching. Add transformation only after the site is stable.</h2>\n\t\t\t</header>\n\t\t\t<ol class=\"gtp-shop-steps\">\n\t\t\t\t<li><span>1</span><div><h3>Install the owned page-cache drop-in</h3><p>GT Performance checks ownership and leaves another plugin's drop-in untouched.</p></div></li>\n\t\t\t\t<li><span>2</span><div><h3>Verify a public MISS, then HIT</h3><p>Test an anonymous page and confirm private or personalized routes continue to bypass.</p></div></li>\n\t\t\t\t<li><span>3</span><div><h3>Connect Cloudflare Free</h3><p>Use a scoped token when possible, synchronize one managed cache rule, then verify edge hits.</p></div></li>\n\t\t\t\t<li><span>4</span><div><h3>Add CSS, JavaScript, media, or Redis one layer at a time</h3><p>Each module has its own settings, reports, exceptions, and ownership checks.</p></div></li>\n\t\t\t</ol>\n\t\t</div>\n\t</section>\n\n\t<section class=\"gtp-shop-section gtp-shop-section--alpha\" id=\"gtp-shop-alpha\" aria-labelledby=\"gtp-shop-alpha-title\">\n\t\t<div class=\"inner block-double-tb block-half-lr\">\n\t\t\t<div class=\"gtp-shop-alpha\">\n\t\t\t\t<div>\n\t\t\t\t\t<p class=\"gtp-shop-kicker\">Controlled alpha</p>\n\t\t\t\t\t<h2 id=\"gtp-shop-alpha-title\">Use staging first. Cache plugins do not deserve blind trust.</h2>\n\t\t\t\t\t<p>GT Performance has package, Studio, origin-cache, Cloudflare, Redis, and unused-CSS validation behind it. The compatibility matrix is still growing across hosting stacks, checkout setups, and multisite.</p>\n\t\t\t\t\t<p>Alpha users should keep backups, test checkout and account flows, and enable aggressive frontend transformations only after the core cache path is stable.</p>\n\t\t\t\t</div>\n\t\t\t\t<div class=\"gtp-shop-alpha__actions\">\n\t\t\t\t\t<a class=\"gtp-shop-button gtp-shop-button--primary\" href=\"https://github.com/wpgaurav/gt-performance/releases\">View current release</a>\n\t\t\t\t\t<a class=\"gtp-shop-button gtp-shop-button--secondary\" href=\"https://github.com/wpgaurav/gt-performance\">Inspect the source</a>\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t</div>\n\t</section>\n\n\t<section class=\"gtp-shop-section gtp-shop-section--light\" aria-labelledby=\"gtp-shop-faq-title\">\n\t\t<div class=\"inner block-double-tb block-half-lr\">\n\t\t\t<header class=\"gtp-shop-heading\">\n\t\t\t\t<p class=\"gtp-shop-kicker\">Questions worth answering</p>\n\t\t\t\t<h2 id=\"gtp-shop-faq-title\">GT Performance FAQ</h2>\n\t\t\t</header>\n\t\t\t<div class=\"gtp-shop-faq\">\n\t\t\t\t<details><summary>Does Cloudflare require a paid plan?</summary><p>No. The baseline uses Cache Rules and targeted purges available on Cloudflare Free. APO, Workers, Cache Reserve, Argo, and Enterprise are not required.</p></details>\n\t\t\t\t<details><summary>Does unused CSS leave my server?</summary><p>No. Stylesheet collection, selector analysis, pruning, artifact creation, and reporting run on the WordPress server.</p></details>\n\t\t\t\t<details><summary>Can GT Performance work with Perfmatters?</summary><p>Yes. Choose which plugin owns overlapping frontend work. GT Performance reports active optimization owners instead of letting both plugins rewrite the same response.</p></details>\n\t\t\t\t<details><summary>What happens if another cache plugin owns a drop-in?</summary><p>GT Performance reports the conflict and refuses to overwrite the foreign advanced-cache.php or object-cache.php file.</p></details>\n\t\t\t\t<details><summary>How are updates delivered?</summary><p>A FluentCart license activates the site. WordPress receives version metadata normally, but the protected ZIP is returned only for a valid site activation.</p></details>\n\t\t\t</div>\n\t\t</div>\n\t</section>\n</div>\n","css":".gtp-shop {\n\t--gtp-shop-ink: #17212b;\n\t--gtp-shop-muted: #536575;\n\t--gtp-shop-border: #d5e0e7;\n\t--gtp-shop-blue: #2271b1;\n\t--gtp-shop-blue-dark: #0a4b78;\n\t--gtp-shop-navy: #071e2f;\n\t--gtp-shop-pale: #eef6fb;\n\t--gtp-shop-surface: #ffffff;\n\tcolor: var(--gtp-shop-ink);\n\tfont-family: var(--font-body, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif);\n}\n\n.gtp-shop *,\n.gtp-shop *::before,\n.gtp-shop *::after {\n\tbox-sizing: border-box;\n}\n\n.gtp-shop h1,\n.gtp-shop h2,\n.gtp-shop h3 {\n\tfont-family: var(--font-head, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif);\n\tletter-spacing: -0.025em;\n}\n\n.gtp-shop h1 {\n\tmax-width: 780px;\n\tmargin: 0;\n\tcolor: #fff;\n\tfont-size: clamp(2.55rem, 5.8vw, 5.4rem);\n\tline-height: 1.02;\n}\n\n.gtp-shop h2 {\n\tmax-width: 840px;\n\tmargin: 0;\n\tfont-size: clamp(2rem, 4vw, 3.7rem);\n\tline-height: 1.08;\n}\n\n.gtp-shop h3 {\n\tmargin: 0;\n\tfont-size: 1.25rem;\n\tline-height: 1.25;\n}\n\n.gtp-shop p {\n\tline-height: 1.65;\n}\n\n.gtp-shop-hero {\n\tposition: relative;\n\toverflow: hidden;\n\tbackground-color: var(--gtp-shop-navy);\n\tbackground-image:\n\t\tlinear-gradient(rgba(114, 174, 230, 0.12) 1px, transparent 1px),\n\t\tlinear-gradient(90deg, rgba(114, 174, 230, 0.12) 1px, transparent 1px);\n\tbackground-size: 88px 88px;\n}\n\n.gtp-shop-hero__grid,\n.gtp-shop-split {\n\tdisplay: grid;\n\tgrid-template-columns: minmax(0, 0.95fr) minmax(420px, 1.05fr);\n\talign-items: center;\n\tgap: clamp(36px, 6vw, 88px);\n}\n\n.gtp-shop-hero__copy > p:not(.gtp-shop-kicker) {\n\tmax-width: 720px;\n\tcolor: #c5d9e8;\n\tfont-size: 1.16rem;\n}\n\n.gtp-shop-kicker {\n\tmargin: 0 0 18px;\n\tcolor: #4f94d4;\n\tfont-size: 0.8rem;\n\tfont-weight: 750;\n\tletter-spacing: 0.12em;\n\ttext-transform: uppercase;\n}\n\n.gtp-shop-hero .gtp-shop-kicker,\n.gtp-shop-section--blue .gtp-shop-kicker,\n.gtp-shop-section--alpha .gtp-shop-kicker {\n\tcolor: #72aee6;\n}\n\n.gtp-shop-lede {\n\tmargin-top: 28px;\n\tfont-size: 1.3rem !important;\n}\n\n.gtp-shop-actions {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\tgap: 12px;\n\tmargin-top: 30px;\n}\n\n.gtp-shop-button {\n\tdisplay: inline-flex;\n\talign-items: center;\n\tjustify-content: center;\n\tmin-height: 48px;\n\tpadding: 0 22px;\n\tborder: 1px solid transparent;\n\tborder-radius: 4px;\n\tfont-weight: 700;\n\ttext-decoration: none;\n}\n\n.gtp-shop-button--primary {\n\tcolor: #fff;\n\tbackground: var(--gtp-shop-blue);\n\tborder-color: #72aee6;\n}\n\n.gtp-shop-button--secondary {\n\tcolor: #eaf4fb;\n\tbackground: transparent;\n\tborder-color: #4b6c82;\n}\n\n.gtp-shop-button:hover,\n.gtp-shop-button:focus {\n\ttransform: translateY(-1px);\n}\n\n.gtp-shop-tags {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\tgap: 10px;\n\tmargin: 28px 0 0;\n\tpadding: 0;\n\tlist-style: none;\n}\n\n.gtp-shop-tags li {\n\tpadding: 7px 11px;\n\tcolor: #d7e7f2;\n\tbackground: #103a57;\n\tborder: 1px solid #3679a8;\n\tborder-radius: 3px;\n\tfont-size: 0.8rem;\n\tfont-weight: 650;\n}\n\n.gtp-shop-hero__visual,\n.gtp-shop-report {\n\tmargin: 0;\n}\n\n.gtp-shop-hero__visual img,\n.gtp-shop-report img {\n\tdisplay: block;\n\twidth: 100%;\n\theight: auto;\n\tborder: 1px solid #4d7c9a;\n\tborder-radius: 6px;\n\tbox-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);\n}\n\n.gtp-shop-hero__visual figcaption,\n.gtp-shop-report figcaption {\n\tmargin-top: 12px;\n\tcolor: #9fb9ca;\n\tfont-size: 0.82rem;\n\ttext-align: center;\n}\n\n.gtp-shop-section {\n\tbackground: var(--gtp-shop-surface);\n}\n\n.gtp-shop-section--light {\n\tbackground: #f5f8fa;\n}\n\n.gtp-shop-section--blue,\n.gtp-shop-section--alpha {\n\tcolor: #fff;\n\tbackground: var(--gtp-shop-navy);\n}\n\n.gtp-shop-heading {\n\tmax-width: 900px;\n\tmargin-bottom: 44px;\n}\n\n.gtp-shop-heading > p:last-child {\n\tmax-width: 760px;\n\tmargin: 18px 0 0;\n\tcolor: var(--gtp-shop-muted);\n\tfont-size: 1.08rem;\n}\n\n.gtp-shop-grid {\n\tdisplay: grid;\n\tgap: 18px;\n}\n\n.gtp-shop-grid--three {\n\tgrid-template-columns: repeat(3, minmax(0, 1fr));\n}\n\n.gtp-shop-card,\n.gtp-shop-feature {\n\tpadding: 28px;\n\tbackground: #fff;\n\tborder: 1px solid var(--gtp-shop-border);\n\tborder-radius: 6px;\n}\n\n.gtp-shop-card__number {\n\tdisplay: block;\n\tmargin-bottom: 42px;\n\tcolor: var(--gtp-shop-blue);\n\tfont-size: 0.78rem;\n\tfont-weight: 750;\n\tletter-spacing: 0.1em;\n}\n\n.gtp-shop-card p,\n.gtp-shop-feature p {\n\tmargin: 12px 0 0;\n\tcolor: var(--gtp-shop-muted);\n}\n\n.gtp-shop-feature {\n\tposition: relative;\n\tpadding-top: 64px;\n}\n\n.gtp-shop-feature::before {\n\tposition: absolute;\n\ttop: 28px;\n\tleft: 28px;\n\twidth: 30px;\n\theight: 4px;\n\tbackground: var(--gtp-shop-blue);\n\tcontent: \"\";\n}\n\n.gtp-shop-section--blue .gtp-shop-split > div > p:not(.gtp-shop-kicker) {\n\tcolor: #c5d9e8;\n}\n\n.gtp-shop-checks {\n\tdisplay: grid;\n\tgap: 12px;\n\tmargin: 28px 0 0;\n\tpadding: 0;\n\tlist-style: none;\n}\n\n.gtp-shop-checks li {\n\tposition: relative;\n\tpadding-left: 27px;\n\tcolor: #eaf4fb;\n}\n\n.gtp-shop-checks li::before {\n\tposition: absolute;\n\ttop: 0.56em;\n\tleft: 0;\n\twidth: 11px;\n\theight: 11px;\n\tbackground: #72aee6;\n\tcontent: \"\";\n}\n\n.gtp-shop-compat {\n\tdisplay: grid;\n\tgrid-template-columns: repeat(2, minmax(0, 1fr));\n\tborder-top: 1px solid var(--gtp-shop-border);\n\tborder-left: 1px solid var(--gtp-shop-border);\n}\n\n.gtp-shop-compat > div {\n\tpadding: 24px;\n\tbackground: #fff;\n\tborder-right: 1px solid var(--gtp-shop-border);\n\tborder-bottom: 1px solid var(--gtp-shop-border);\n}\n\n.gtp-shop-compat strong,\n.gtp-shop-compat span {\n\tdisplay: block;\n}\n\n.gtp-shop-compat span {\n\tmargin-top: 7px;\n\tcolor: var(--gtp-
