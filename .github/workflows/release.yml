name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      zip_name: ${{ steps.metadata.outputs.zip_name }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer:v2
          extensions: dom, json, mbstring

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-release-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-release-

      - name: Validate tag and release metadata
        id: metadata
        run: php bin/release-metadata.php --tag="$GITHUB_REF_NAME" --notes-file="$RUNNER_TEMP/release-notes.md" --github-output="$GITHUB_OUTPUT"

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-version

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run release quality suite
        run: composer check

      - name: Build production ZIP
        env:
          GTPERF_PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
        run: ./bin/build-package.sh

      - name: Verify packaged version and checksum
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          ZIP_NAME: ${{ steps.metadata.outputs.zip_name }}
        run: |
          set -euo pipefail
          unzip -p "dist/${ZIP_NAME}" gt-performance/gt-performance.php | grep -F "Version: ${VERSION}"
          unzip -p "dist/${ZIP_NAME}" gt-performance/readme.txt | grep -F "Stable tag: ${VERSION}"
          (
            cd dist
            sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"
            sha256sum --check "${ZIP_NAME}.sha256"
          )

      - name: Retain the verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.metadata.outputs.version }}
          path: |
            dist/${{ steps.metadata.outputs.zip_name }}
            dist/${{ steps.metadata.outputs.zip_name }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attest the release ZIP
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ steps.metadata.outputs.zip_name }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          ZIP_NAME: ${{ steps.metadata.outputs.zip_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
            exit 1
          fi

          args=(
            "${TAG}"
            "dist/${ZIP_NAME}#GT Performance ${VERSION}"
            "dist/${ZIP_NAME}.sha256#SHA-256 checksum"
            --title "GT Performance ${VERSION}"
            --notes-file "$RUNNER_TEMP/release-notes.md"
            --verify-tag
            --fail-on-no-commits
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease --latest=false)
          fi

          gh release create "${args[@]}"

  wordpress-org:
    name: Deploy to WordPress.org
    needs: release
    # Stable versions only. release-metadata.php marks any version with a
    # pre-release suffix (1.2.0-rc.1, 1.2.0-beta.2) as a GitHub prerelease.
    if: needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: wordpress.org
      url: https://wordpress.org/plugins/gt-performance/
    concurrency:
      group: wordpress-org-deploy
      cancel-in-progress: false

    steps:
      - name: Check out the directory assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm the GitHub release is stable
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          state="$(gh release view "${TAG}" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
          if [[ "${state}" != "false false" ]]; then
            echo "::error::${TAG} is a draft or prerelease (isDraft isPrerelease = ${state}). Not deploying."
            exit 1
          fi

      - name: Download the verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/release

      - name: Unpack and verify the WordPress.org package
        id: package
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ZIP_NAME: ${{ needs.release.outputs.zip_name }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/release"
          sha256sum --check "${ZIP_NAME}.sha256"
          unzip -q "${ZIP_NAME}" -d "${RUNNER_TEMP}/wporg"
          plugin="${RUNNER_TEMP}/wporg/gt-performance"
          grep -F "Version: ${VERSION}" "${plugin}/gt-performance.php"
          grep -F "Stable tag: ${VERSION}" "${plugin}/readme.txt"
          if grep -q "^Update URI:" "${plugin}/gt-performance.php"; then
            echo "::error::The WordPress.org package must not carry an Update URI header."
            exit 1
          fi
          if [[ -e "${plugin}/src/Licensing" ]]; then
            echo "::error::The WordPress.org package must not contain src/Licensing."
            exit 1
          fi
          echo "build_dir=${plugin}" >> "$GITHUB_OUTPUT"

      - name: Ensure Subversion is installed
        run: command -v svn || { sudo apt-get update -qq && sudo apt-get install -y -qq subversion; }

      - name: Commit trunk, tag and assets to SVN
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: gt-performance
          VERSION: ${{ needs.release.outputs.version }}
          BUILD_DIR: ${{ steps.package.outputs.build_dir }}
          ASSETS_DIR: distribution-assets/wordpress-org

      - name: Confirm the SVN tag exists
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          svn ls "https://plugins.svn.wordpress.org/gt-performance/tags/${VERSION}/gt-performance.php"
          echo "Deployed GT Performance ${VERSION} to https://plugins.svn.wordpress.org/gt-performance/tags/${VERSION}/" >> "$GITHUB_STEP_SUMMARY"
